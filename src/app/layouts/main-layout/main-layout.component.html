<div class="app-layout">
  <!-- Header / Navigation Bar -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-section">
        <div class="brand-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">PERMISSION MANAGEMENT</span>
          <span class="brand-subtitle">Hệ thống Phân quyền </span>
        </div>
      </div>

      <nav class="nav-menu">
        <a routerLink="/users" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">👤</span>
          <span>Người Dùng</span>
        </a>
        <a routerLink="/roles" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">🛡️</span>
          <span>Vai Trò</span>
        </a>
        <a routerLink="/permissions" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">🔑</span>
          <span>Quyền Hạn</span>
        </a>
      </nav>

      <div class="user-profile">
        <div class="user-avatar">
          {{ (authService.getUsername() || 'U').charAt(0).toUpperCase() }}
        </div>
        <div class="user-details">
          <span class="user-name">{{ authService.getUsername() }}</span>
          <span class="badge" [ngClass]="authService.isAdmin() ? 'role-badge' : 'perm-badge'">
            {{ authService.isAdmin() ? 'ADMINISTRATOR' : 'STAFF MEMBER' }}
          </span>
        </div>
        <button class="btn-logout" (click)="onLogout()" title="Đăng xuất khỏi hệ thống">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          <span>Đăng Xuất</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-body">
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </main>
